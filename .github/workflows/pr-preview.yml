name: WordPress Playground preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
    paths:
      - "theme/**"
      - ".github/workflows/pr-preview.yml"

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: WordPress/action-wp-playground-pr-preview@v3
        with:
          blueprint: |
            {
              "$schema": "https://playground.wordpress.net/blueprint-schema.json",
              "steps": [
                {
                  "step": "installTheme",
                  "themeData": {
                    "resource": "wordpress.org/themes",
                    "slug": "koji"
                  }
                },
                {
                  "step": "installTheme",
                  "themeData": {
                    "resource": "git:directory",
                    "url": "https://github.com/${{ github.repository }}",
                    "ref": "refs/pull/${{ github.event.pull_request.number }}/head",
                    "refType": "refname",
                    "path": "theme"
                  },
                  "options": {
                    "activate": true
                  }
                },
                {
                  "step": "importWxr",
                  "file": {
                    "resource": "url",
                    "url": "https://raw.githubusercontent.com/WordPress/theme-test-data/master/themeunittestdata.wordpress.xml"
                  }
                },
                {
                  "step": "runPHP",
                  "code": "<?php\nrequire '/wordpress/wp-load.php';\n\nupdate_option( 'blogname', 'd3.codes' );\nupdate_option( 'blogdescription', '' );\nset_theme_mod( 'koji_pagination_type', 'scroll' );\n\n$sidebars = get_option( 'sidebars_widgets', array() );\nforeach ( array( 'sidebar', 'footer-one', 'footer-two', 'footer-three' ) as $sidebar ) {\n    $sidebars[ $sidebar ] = array();\n}\nupdate_option( 'sidebars_widgets', $sidebars );"
                }
              ]
            }
          github-token: ${{ secrets.GITHUB_TOKEN }}
