name: Deploy theme to production

on:
  push:
    branches: [main]
    paths:
      - "theme/**"
  workflow_dispatch:

concurrency:
  group: production-theme
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Sync theme files
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTPS_HOST }}
          username: ${{ secrets.FTPS_USERNAME }}
          password: ${{ secrets.FTPS_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./theme/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
