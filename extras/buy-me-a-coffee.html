<!-- Replace the existing Sidebar Custom HTML block's embed with this entire snippet. -->
<div data-coffee-widget>
  <a href="https://buymeacoffee.com/D3codes" target="_blank" rel="noopener noreferrer">Support my work</a>
  <script>
  (function () {
    'use strict';
    var host = document.currentScript.parentElement;
    var root = document.documentElement;
    var button = host.querySelector('a');

    function apply() {
      var mode = root.getAttribute('data-color-scheme');
      // Koji stays light when its optional mode toggle is disabled.
      var dark = mode === 'dark';
      button.style.cssText = 'display:inline-flex!important;align-items:center;box-sizing:border-box!important;' +
        'min-width:180px!important;height:60px;padding:0 24px;border:0;border-radius:200px!important;' +
        'font:700 16px/27px Arial,sans-serif!important;text-decoration:none!important;cursor:pointer;' +
        'background-color:' + (dark ? '#f1f2f4' : '#232323') + '!important;' +
        'color:' + (dark ? '#232323' : '#ffffff') + '!important;';
      host.querySelectorAll('.logo-outline').forEach(function (path) {
        path.style.fill = dark ? '#232323' : '#ffffff';
      });
    }
    apply();
    new MutationObserver(apply).observe(root, { attributes: true, attributeFilter: ['data-color-scheme'] });

    // Load once for both desktop and mobile instances. Omit data-name so the
    // vendor script does not run its document.write-based automatic embed.
    if (!window.d3CoffeeLibrary) {
      window.d3CoffeeLibrary = new Promise(function (resolve, reject) {
        if (window.bmcBtnWidget) { resolve(); return; }
        var script = document.createElement('script');
        script.src = 'https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js';
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }
    window.d3CoffeeLibrary.then(function () {
      var template = document.createElement('template');
      template.innerHTML = window.bmcBtnWidget('Support my work', 'D3codes', '#232323', '', 'Arial', '#ffffff', '#ffffff', '#FFDD00');
      var rendered = template.content.querySelector('a');
      rendered.rel = 'noopener noreferrer';
      rendered.querySelector('svg').style.cssText = 'height:28px!important;width:auto;margin-bottom:0!important;box-shadow:none!important;border:none!important;vertical-align:middle!important;transform:scale(.9);flex-shrink:0;';
      rendered.querySelector('svg').setAttribute('aria-hidden', 'true');
      rendered.querySelector('.bmc-btn-text').style.cssText = 'text-align:left;margin-left:8px;display:inline-block;white-space:nowrap;';
      // Only insert the anchor: vendor stylesheets and font links stay out.
      button.replaceWith(rendered);
      button = rendered;
      apply();
    }).catch(function () { /* Keep the styled, working fallback link. */ });
  }());
  </script>
</div>
